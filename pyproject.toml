[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comp3005-ra-engine"
version = "0.1.0"
requires-python = ">=3.8"

[project.scripts]
storage = "storage.cli:main"
exec = "execution.cli:main"

[tool.setuptools.packages.find]
include = ["ra_engine*", "storage*", "execution*"]